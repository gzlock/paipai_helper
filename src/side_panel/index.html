<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>批量评分</title>
    <style>
        html {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }

        input,
        textarea,
        select {
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            cursor: pointer;
            border-radius: 4px;
            border: none;
        }

        button:disabled {
            cursor: default !important;
            background: #f7f7f7 !important;
            color: #aaa !important;
        }

        /* Panel */
        .panel-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* Labels */
        #rating-panel label {
            display: block;
            margin-bottom: 6px;
        }

        /* Input and textarea */
        #rating-input {
            width: 60px;
        }

        #rating-content {
            width: calc(100% - 12px);
            display: block;
            padding: 6px;
            resize: vertical;
            margin-bottom: 8px;
        }

        /* Actions */
        #rating-panel .actions {
            text-align: right;
        }

        #rating-cancel {
            margin-right: 8px;
            padding: 6px 10px;
            background: red;
            color: #fff;
        }

        #rating-submit {
            padding: 6px 12px;
            background: #2196f3;
            color: #fff;
        }

        /* Message */
        #rating-msg {
            margin-top: 8px;
            color: green;
            display: none;
            font-size: 13px;
        }

        .tips {
            margin-bottom: 20px;
            color: #999;
        }

        #tasks-msg {
            cursor: pointer !important;
        }
    </style>
    <link rel="stylesheet" href="/global.css">
</head>

<body>
    <button id="reload" style="display: none;" debug>刷新</button>
    <div class="links">
        <a href="/options/index.html" target="_blank">全局设置</a>
        <a href="/dash/index.html" target="_blank">任务列表</a>
        <a href="/logs/index.html" target="_blank">日志记录</a>
    </div>
    <div id="rating-panel" class="panel">
        <div class="panel-title">
            <div>创建批量评分任务</div>
            <div id="thread-title"></div>
        </div>
        <div class="panel-content">
            <label>评分</label>
            <input id="rating-input" type="number" value="1" min="1" />
            <select id="cid" vaule="money">
                <option value="money">派派币</option>
                <option value="flower">鲜花</option>
                <option value="rvrc">威望</option>
            </select>
            <label>内容</label>
            <textarea id="rating-content" placeholder="输入评分内容" rows="4">回礼</textarea>
            <div>
                <label>从第x楼开始<br>0是主楼，1即1楼</label>
                <input id="rating-start" type="number" value="1" min="0" />
            </div>
            <div>
                <label>一共派多少楼（0就是不限制）</label>
                <input id="rating-end" type="number" value="0" min="0" />
                <div class="tips">
                    注意：不是派到第几楼结束，而是派多少楼。<br />
                    跳过的用户、已派发过的用户（同一个帖子一个用户发多个回复）不计入这个数量。<br />
                    例如：从1楼开始，派10楼，跳过了2个用户，那么会派到12楼结束。
                </div>
            </div>
            <div>
                <label>消息通知（对送鲜花不起作用）</label>
                <input id="ifmsg" type="checkbox" />
            </div>
            <div class="actions">
                <!-- <button id="rating-cancel" disabled>终止评分过程</button> -->
                <button id="rating-submit">创建任务</button>
            </div>
            <div id="rating-msg"></div>
        </div>
    </div>
    <hr />
    <div id="tasks-panel" class="panel">
        <div class="panel-title">全局任务列表</div>
        <div class="panel-content">
            <div id="tasks-msg">
                当前没有全局任务, 点击查看列表
            </div>
        </div>
    </div>
    </div>
    <p id="debug"></p>
    <script type="module" src="./side_panel.js"></script>
    <script type="module" src="./debug.js"></script>
</body>

</html>
